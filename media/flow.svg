<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="How it works: one JSON price store feeds shortcodes that render live prices and per-unit figures in every article">
  <rect width="1200" height="300" fill="#f7f3ea"/>
  <!-- store box -->
  <g>
    <rect x="40" y="70" width="300" height="160" rx="14" fill="#151515"/>
    <text x="70" y="118" font-family="Verdana, sans-serif" font-size="22" font-weight="bold" fill="#f5b942">prices.json</text>
    <text x="70" y="156" font-family="monospace" font-size="19" fill="#f7f3ea">"price": 299.95,</text>
    <text x="70" y="186" font-family="monospace" font-size="19" fill="#f7f3ea">"checked": "2026-11-07"</text>
    <text x="70" y="216" font-family="Verdana, sans-serif" font-size="16" fill="#9a927f">one file — update once</text>
  </g>
  <!-- arrow 1 -->
  <path d="M352 150 H468" stroke="#e07b2a" stroke-width="5" marker-end="url(#ah)"/>
  <!-- shortcode box -->
  <g>
    <rect x="486" y="70" width="300" height="160" rx="14" fill="#ffffff" stroke="#e07b2a" stroke-width="3"/>
    <text x="516" y="118" font-family="Verdana, sans-serif" font-size="22" font-weight="bold" fill="#151515">Shortcodes</text>
    <text x="516" y="156" font-family="monospace" font-size="18" fill="#44403a">[po_price id="…"]</text>
    <text x="516" y="186" font-family="monospace" font-size="18" fill="#44403a">[po_peroz id="…"]</text>
    <text x="516" y="216" font-family="monospace" font-size="18" fill="#44403a">[po_permonth id="…"]</text>
  </g>
  <!-- arrow 2 -->
  <path d="M798 150 H914" stroke="#e07b2a" stroke-width="5" marker-end="url(#ah)"/>
  <!-- article box -->
  <g>
    <rect x="932" y="70" width="228" height="160" rx="14" fill="#151515"/>
    <text x="962" y="118" font-family="Verdana, sans-serif" font-size="22" font-weight="bold" fill="#f7f3ea">Every article</text>
    <text x="962" y="158" font-family="Georgia, serif" font-size="24" fill="#f5b942">$299.95</text>
    <text x="962" y="192" font-family="Verdana, sans-serif" font-size="17" fill="#cfc8b8">at Amazon · checked</text>
    <text x="962" y="216" font-family="Verdana, sans-serif" font-size="17" fill="#cfc8b8">Nov 7, 2026</text>
  </g>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L9 3 L0 6 Z" fill="#e07b2a"/>
    </marker>
  </defs>
</svg>
